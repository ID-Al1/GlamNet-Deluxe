openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: GlamNet API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: users
    description: User management
  - name: stylists
    description: Stylist profiles and portfolios
  - name: appointments
    description: Appointment booking
  - name: messages
    description: Client-stylist messaging
  - name: casting
    description: Brand casting calls
  - name: dashboard
    description: Dashboard summaries
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/signup:
    post:
      operationId: signup
      tags: [auth]
      summary: Create a new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /stylists:
    get:
      operationId: listStylists
      tags: [stylists]
      summary: List stylists with optional filters
      parameters:
        - name: specialty
          in: query
          schema:
            type: string
        - name: location
          in: query
          schema:
            type: string
        - name: verified
          in: query
          schema:
            type: boolean
        - name: search
          in: query
          schema:
            type: string
        - name: minRating
          in: query
          schema:
            type: number
        - name: maxPrice
          in: query
          schema:
            type: number
        - name: houseCalls
          in: query
          schema:
            type: boolean
        - name: availabilityDay
          in: query
          schema:
            type: string
        - name: language
          in: query
          schema:
            type: string
        - name: service
          in: query
          description: Filter by service name (partial match against stylist services)
          schema:
            type: string
        - name: area
          in: query
          description: Filter by area/neighbourhood (proximity proxy)
          schema:
            type: string
      responses:
        "200":
          description: List of stylists
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StylistProfile"

  /stylists/{stylistId}:
    get:
      operationId: getStylist
      tags: [stylists]
      summary: Get stylist profile
      parameters:
        - name: stylistId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stylist profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StylistProfile"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /stylists/me/profile:
    get:
      operationId: getMyStylistProfile
      tags: [stylists]
      summary: Get my stylist profile
      responses:
        "200":
          description: My stylist profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyStylistProfile"

    patch:
      operationId: updateMyStylistProfile
      tags: [stylists]
      summary: Update my stylist profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StylistProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyStylistProfile"

  /stylists/me/services:
    post:
      operationId: addStylistService
      tags: [stylists]
      summary: Add a service to my profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"

  /stylists/me/services/{serviceId}:
    patch:
      operationId: updateStylistService
      tags: [stylists]
      summary: Update a service
      parameters:
        - name: serviceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceUpdate"
      responses:
        "200":
          description: Updated service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"

    delete:
      operationId: deleteStylistService
      tags: [stylists]
      summary: Delete a service
      parameters:
        - name: serviceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /stylists/me/portfolio:
    post:
      operationId: addPortfolioItem
      tags: [stylists]
      summary: Add portfolio item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortfolioItemInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioItem"

  /stylists/me/portfolio/{itemId}:
    delete:
      operationId: deletePortfolioItem
      tags: [stylists]
      summary: Delete portfolio item
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /stylists/me/verification-submit:
    patch:
      operationId: submitForVerification
      tags: [stylists]
      summary: Submit profile for verification
      description: >
        Transitions verificationStatus from "none" to "pending" and notifies
        the artist by email (and WhatsApp if she has a number on file).
        Returns 409 if already pending or verified.
      responses:
        "200":
          description: Submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "409":
          description: Already pending or verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /stylists/me/identity-verification:
    get:
      operationId: getMyIdentityVerification
      tags: [stylists]
      summary: Get my private identity-verification status
      responses:
        "200":
          description: Private identity-verification status without raw ID values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityVerificationStatus"
    patch:
      operationId: saveMyIdentityVerification
      tags: [stylists]
      summary: Save my private ID number and identity document reference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentityVerificationInput"
      responses:
        "200":
          description: Identity verification saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityVerificationStatus"

  /stylists/me/bank-details:
    get:
      operationId: getMyBankDetails
      tags: [stylists]
      responses:
        "200":
          description: Masked bank details, or null when none have been submitted
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/BankAccountSafe"
                  - type: "null"
    patch:
      operationId: updateMyBankDetails
      tags: [stylists]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/BankAccountInput" } }
      responses:
        "200": { description: Saved masked bank details, content: { application/json: { schema: { $ref: "#/components/schemas/BankAccountSafe" } } } }

  /stylists/me/identity-document/upload-url:
    post:
      operationId: requestIdentityDocumentUploadUrl
      tags: [stylists]
      summary: Request a private upload URL for an identity document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaUploadUrlRequest"
      responses:
        "200":
          description: Private identity-document upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaUploadUrlResponse"

  /stylists/me/verification-checklist:
    get:
      operationId: getVerificationChecklist
      tags: [stylists]
      summary: Get my verification checklist
      description: >
        Returns each readiness criterion and whether it is met, plus the current
        verification status. Artists use this to see exactly what they must
        complete before they appear in search results and can accept bookings.
      responses:
        "200":
          description: Verification checklist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationChecklist"

  /appointments:
    get:
      operationId: listAppointments
      tags: [appointments]
      summary: List appointments for current user
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, confirmed, completed, cancelled, declined]
        - name: role
          in: query
          schema:
            type: string
            enum: [client, stylist]
      responses:
        "200":
          description: Appointments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Appointment"

    post:
      operationId: createAppointment
      tags: [appointments]
      summary: Book an appointment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"

  /appointments/{appointmentId}:
    get:
      operationId: getAppointment
      tags: [appointments]
      summary: Get appointment details
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Appointment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"

    patch:
      operationId: updateAppointment
      tags: [appointments]
      summary: Update appointment status
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"

  /messages/conversations:
    get:
      operationId: listConversations
      tags: [messages]
      summary: List conversations for current user
      responses:
        "200":
          description: Conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"

  /messages/conversations/{conversationId}:
    get:
      operationId: getConversation
      tags: [messages]
      summary: Get messages in a conversation
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"

  /messages/conversations/{conversationId}/send:
    post:
      operationId: sendMessage
      tags: [messages]
      summary: Send a message
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /messages/start:
    post:
      operationId: startConversation
      tags: [messages]
      summary: Start a conversation with a stylist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartConversationInput"
      responses:
        "201":
          description: Conversation created or existing returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"

  /messages/conversations/{conversationId}/typing:
    post:
      operationId: signalTyping
      tags: [messages]
      summary: Signal that the current user is typing
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Accepted

  /messages/conversations/{conversationId}/read:
    post:
      operationId: markConversationRead
      tags: [messages]
      summary: Mark a conversation as read for the current user
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Accepted

  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [messages]
      summary: Request a presigned upload URL for a media attachment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaUploadUrlRequest"
      responses:
        "200":
          description: Presigned URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaUploadUrlResponse"

  /owner/command-centre:
    get:
      operationId: getOwnerCommandCentre
      tags: [owner]
      summary: Get the owner command-centre metrics
      responses:
        "200":
          description: Real-time owner metrics from existing artist and appointment data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerCommandCentreMetrics"

  /owner/registry:
    get:
      operationId: searchOwnerRegistry
      tags: [owner]
      summary: Search the owner registry
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
      responses:
        "200":
          description: Owner-only registry entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OwnerRegistryEntry"

  /owner/artists:
    get:
      operationId: listOwnerArtists
      tags: [owner]
      summary: List owner artist management summaries
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 80 } }
        - { name: status, in: query, schema: { type: string, enum: [active, suspended] } }
      responses:
        "200":
          description: Artist summaries
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/OwnerArtistSummary" } } } }

  /owner/artists/not-submitted:
    get:
      operationId: listOwnerArtistsNotSubmitted
      tags: [owner]
      summary: List artists who have not submitted for verification and their outstanding requirements
      responses:
        "200":
          description: Artists with verification status none
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OwnerArtistNotSubmitted"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /owner/artists/{profileId}/management:
    get:
      operationId: getOwnerArtistManagement
      tags: [owner]
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 10000, default: 0 } }
      responses:
        "200": { description: Artist management detail, content: { application/json: { schema: { $ref: "#/components/schemas/OwnerArtistManagement" } } } }
  /owner/artists/{profileId}/account-status:
    post:
      operationId: updateOwnerArtistAccountStatus
      tags: [owner]
      parameters: [{ name: profileId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OwnerArtistAccountStatusInput" } } }
      responses:
        "200": { description: Updated account status, content: { application/json: { schema: { $ref: "#/components/schemas/OwnerArtistAccountStatusResult" } } } }

  /owner/payouts:
    get:
      operationId: getOwnerPayouts
      tags: [owner]
      summary: List unpaid payouts grouped by artist
      parameters:
        - name: filter
          in: query
          schema:
            type: string
            enum: [oldest, highest, this-week, all-time]
      responses:
        "200":
          description: Unpaid payout groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OwnerPayoutGroup"

  /owner/payouts/{artistProfileId}/mark-paid:
    post:
      operationId: markOwnerPayoutPaid
      tags: [owner]
      summary: Record an EFT and mark currently due lines paid
      parameters:
        - name: artistProfileId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkOwnerPayoutInput"
      responses:
        "200":
          description: Payout batch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerPayoutBatch"

  /owner/payments-overview:
    get:
      operationId: getOwnerPaymentsOverview
      tags: [owner]
      summary: List booking-level payout and ledger details
      responses:
        "200":
          description: Booking payment overview
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OwnerPaymentOverview"

  /owner/registry/{userId}:
    get:
      operationId: getOwnerRegistryProfile
      tags: [owner]
      summary: Get an owner-only internal profile
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Internal profile using existing account and artist data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerRegistryProfile"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /owner/artists/{profileId}/bank:
    patch:
      operationId: updateArtistBankVerification
      tags: [owner]
      parameters: [{ name: profileId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/BankVerificationInput" } } }
      responses:
        "200": { description: Updated bank verification status, content: { application/json: { schema: { $ref: "#/components/schemas/BankVerificationResult" } } } }
  /owner/artists/{profileId}/bank/reveal:
    post:
      operationId: revealArtistBankAccount
      tags: [owner]
      parameters: [{ name: profileId, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Full account number (logged and no-store), content: { application/json: { schema: { type: object, required: [accountNumber], properties: { accountNumber: { type: string } } } } } }

  /owner/artists/{profileId}/identity:
    get:
      operationId: getArtistIdentityForOwner
      tags: [owner]
      summary: Get a pending artist's private identity-verification summary
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Owner-only identity details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerIdentitySummary"

  /owner/artists/{profileId}/identity-document:
    get:
      operationId: getArtistIdentityDocumentForOwner
      tags: [owner]
      summary: Stream a pending artist's private identity document
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Owner-only identity document bytes
          content:
            application/octet-stream: {}

  /complaints:
    post:
      operationId: createComplaint
      tags: [complaints]
      summary: Submit a complaint
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComplaintCreateInput" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Complaint" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    get:
      operationId: listComplaints
      tags: [complaints]
      summary: List my complaints
      responses:
        "200": { description: Complaints, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Complaint" } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /complaints/{complaintId}:
    get:
      operationId: getComplaint
      tags: [complaints]
      parameters: [{ name: complaintId, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Complaint, content: { application/json: { schema: { $ref: "#/components/schemas/Complaint" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /complaints/{complaintId}/evidence:
    post:
      operationId: attachComplaintEvidence
      tags: [complaints]
      parameters: [{ name: complaintId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ComplaintEvidenceInput" } } }
      responses:
        "201": { description: Evidence, content: { application/json: { schema: { $ref: "#/components/schemas/ComplaintEvidence" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /complaints/evidence/{evidenceId}:
    get:
      operationId: getComplaintEvidence
      tags: [complaints]
      summary: Download complaint evidence for an authorized participant or owner
      parameters:
        - name: evidenceId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Private complaint evidence bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            application/pdf:
              schema: { type: string, format: binary }
            video/mp4:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /owner/complaints:
    get:
      operationId: listOwnerComplaints
      tags: [owner]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ComplaintStatus"
      responses:
        "200": { description: Cases, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/OwnerComplaint" } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /owner/complaints/{complaintId}:
    get:
      operationId: getOwnerComplaint
      tags: [owner]
      parameters: [{ name: complaintId, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Owner case, content: { application/json: { schema: { $ref: "#/components/schemas/OwnerComplaintDetail" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /owner/complaints/{complaintId}/actions:
    post:
      operationId: ownerComplaintAction
      tags: [owner]
      parameters: [{ name: complaintId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OwnerComplaintAction" } } }
      responses:
        "200": { description: Action result, content: { application/json: { schema: { $ref: "#/components/schemas/ComplaintActionResult" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /casting:
    get:
      operationId: listCastingCalls
      tags: [casting]
      summary: List active casting calls
      parameters:
        - name: specialty
          in: query
          schema:
            type: string
        - name: brandId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Casting calls
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CastingCall"

    post:
      operationId: createCastingCall
      tags: [casting]
      summary: Post a casting call (brand only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CastingCallInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CastingCall"

  /casting/{castingId}:
    get:
      operationId: getCastingCall
      tags: [casting]
      summary: Get casting call details
      parameters:
        - name: castingId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Casting call
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CastingCall"

    patch:
      operationId: updateCastingCall
      tags: [casting]
      summary: Update a casting call
      parameters:
        - name: castingId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CastingCallUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CastingCall"

    delete:
      operationId: deleteCastingCall
      tags: [casting]
      summary: Delete a casting call
      parameters:
        - name: castingId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /casting/{castingId}/apply:
    post:
      operationId: applyToCastingCall
      tags: [casting]
      summary: Apply to a casting call (stylist)
      parameters:
        - name: castingId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /dashboard/stylist:
    get:
      operationId: getStylistDashboard
      tags: [dashboard]
      summary: Stylist dashboard summary
      responses:
        "200":
          description: Stylist dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StylistDashboard"

  /dashboard/client:
    get:
      operationId: getClientDashboard
      tags: [dashboard]
      summary: Client dashboard summary
      responses:
        "200":
          description: Client dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientDashboard"

  /dashboard/brand:
    get:
      operationId: getBrandDashboard
      tags: [dashboard]
      summary: Brand dashboard summary
      responses:
        "200":
          description: Brand dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandDashboard"

components:
  schemas:
    ComplaintStatus:
      type: string
      enum: [new, under_review, waiting_for_client, waiting_for_artist, resolved, escalated, closed]
    Complaint:
      type: object
      required: [id, caseNumber, category, description, status, evidence]
      properties:
        id: { type: string }
        caseNumber: { type: string, pattern: "^BN-[0-9]{4}-[0-9]{6}$" }
        appointmentId: { type: string, nullable: true }
        category: { type: string, enum: [didnt_arrive, poor_service, payment_issue, refund_request, behaviour, safety_concern, false_review, harassment, other] }
        description: { type: string }
        status: { type: string, enum: [new, under_review, waiting_for_client, waiting_for_artist, resolved, escalated, closed] }
        evidence: { type: array, items: { $ref: "#/components/schemas/ComplaintEvidence" } }
    ComplaintCreateInput:
      type: object
      required: [category, description]
      properties:
        appointmentId: { type: string }
        subjectUserId: { type: string }
        category: { type: string }
        description: { type: string, minLength: 1, maxLength: 10000 }
    ComplaintEvidenceInput:
      type: object
      required: [objectPath, mimeType]
      properties:
        objectPath: { type: string, pattern: "^/objects/uploads/[A-Za-z0-9-]+$" }
        mimeType: { type: string, enum: [image/jpeg, image/png, application/pdf, video/mp4] }
    ComplaintEvidence:
      type: object
      required: [id, mimeType, url]
      properties:
        id: { type: string }
        mimeType: { type: string }
        url: { type: string }
    OwnerComplaint:
      type: object
      required: [id, caseNumber, category, description, status]
      properties:
        id: { type: string }
        caseNumber: { type: string }
        appointmentId: { type: string, nullable: true }
        subjectUserId: { type: string, nullable: true }
        complainantRole: { type: string }
        category: { type: string }
        description: { type: string }
        status: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }
    OwnerComplaintDetail:
      type: object
      required: [id, caseNumber, category, description, status, complainant, notes, activities]
      properties:
        id: { type: string }
        caseNumber: { type: string }
        appointmentId: { type: string, nullable: true }
        subjectUserId: { type: string, nullable: true }
        complainantRole: { type: string }
        category: { type: string }
        description: { type: string }
        status: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }
        evidence: { type: array, items: { $ref: "#/components/schemas/ComplaintEvidence" } }
        complainant:
          $ref: "#/components/schemas/OwnerComplaintUserSummary"
        subject:
          oneOf:
            - $ref: "#/components/schemas/OwnerComplaintUserSummary"
            - type: "null"
        appointment:
          oneOf:
            - $ref: "#/components/schemas/OwnerComplaintAppointmentSummary"
            - type: "null"
        notes:
          type: array
          items:
            type: object
            required: [id, complaintId, ownerId, note, createdAt]
            properties:
              id: { type: string }
              complaintId: { type: string }
              ownerId: { type: string }
              note: { type: string }
              createdAt: { type: string }
        activities:
          type: array
          items:
            type: object
            required: [id, complaintId, action, createdAt]
            properties:
              id: { type: string }
              complaintId: { type: string }
              actorUserId: { type: string, nullable: true }
              action: { type: string }
              details: { type: string, nullable: true }
              createdAt: { type: string }
    OwnerComplaintUserSummary:
      type: object
      required: [userId, name, email, role, accountStatus]
      properties:
        userId: { type: string }
        name: { type: string }
        email: { type: string }
        role: { type: string }
        accountStatus: { type: string, enum: [active, suspended] }
    OwnerComplaintAppointmentSummary:
      type: object
      required: [id, clientUserId, clientName, artistUserId, artistName, serviceName, date, bookingStatus, payoutStatus, grossCollected, refundedAmount, refundableAmount]
      properties:
        id: { type: string }
        clientUserId: { type: string }
        clientName: { type: string }
        artistUserId: { type: string }
        artistName: { type: string }
        serviceName: { type: string }
        date: { type: string }
        bookingStatus: { type: string }
        payoutStatus: { type: string }
        grossCollected: { type: number }
        refundedAmount: { type: number }
        refundableAmount: { type: number }
    OwnerComplaintAction:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [status, note, suspend, hold, release, refund] }
        status: { type: string }
        note:
          type: string
          maxLength: 1000
          description: Required when action is suspend; reason is recorded in the owner-only activity trail.
        userId: { type: string }
        amount: { type: number, minimum: 0 }
    ComplaintActionResult:
      type: object
      required: [ok]
      properties: { ok: { type: boolean } }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    BankAccountInput:
      type: object
      required: [bankName, accountHolderName, accountNumber, accountType]
      properties:
        bankName: { type: string, minLength: 2, maxLength: 100, pattern: '.*\S.*' }
        accountHolderName: { type: string, minLength: 2, maxLength: 150, pattern: '.*\S.*' }
        accountNumber: { type: string, minLength: 5, maxLength: 34, pattern: '^[0-9]+$', writeOnly: true }
        accountType: { type: string, enum: [cheque, savings, other] }
    BankAccountSafe:
      type: object
      required: [id, bankName, accountHolderName, maskedAccountNumber, accountType, verificationStatus, revision]
      properties:
        id: { type: string }
        bankName: { type: string }
        accountHolderName: { type: string }
        maskedAccountNumber: { type: string }
        accountType: { type: string }
        verificationStatus: { type: string, enum: [pending, verified, failed] }
        verifiedAt: { type: ["string", "null"], format: date-time }
        revision: { type: integer, minimum: 1 }
    BankVerificationResult:
      type: object
      required: [verificationStatus, verifiedAt]
      properties:
        verificationStatus: { type: string, enum: [verified, failed] }
        verifiedAt: { type: ["string", "null"], format: date-time }
    BankVerificationInput:
      type: object
      required: [status, revision]
      properties:
        status: { type: string, enum: [verified, failed] }
        revision: { type: integer, minimum: 1 }
    ApiError:
      type: object
      properties:
        error:
          type: string
      required: [error]

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]

    IdentityVerificationInput:
      type: object
      required: [idNumber, idDocumentUrl]
      properties:
        idNumber:
          type: string
          minLength: 6
          maxLength: 32
          pattern: "^[A-Za-z0-9 -]+$"
          writeOnly: true
        idDocumentUrl:
          type: string
          pattern: "^/objects/uploads/[A-Za-z0-9-]+$"
          writeOnly: true

    IdentityVerificationStatus:
      type: object
      required: [idNumberProvided, idDocumentProvided]
      properties:
        idNumberProvided:
          type: boolean
        idDocumentProvided:
          type: boolean

    OwnerIdentitySummary:
      type: object
      required: [idNumber, documentAvailable]
      properties:
        idNumber:
          type: string
        documentAvailable:
          type: boolean

    OwnerCommandCentreMetrics:
      type: object
      required: [totalArtists, verifiedArtists, pendingVerifications, paymentsToRelease, bonisaCommission, openDisputes]
      properties:
        totalArtists:
          type: integer
        verifiedArtists:
          type: integer
        pendingVerifications:
          type: integer
        paymentsToRelease:
          type: number
        bonisaCommission:
          type: number
        openDisputes:
          type: integer

    OwnerPayoutLine:
      type: object
      properties:
        id: { type: string }
        artistProfileId: { type: string }
        artistName: { type: string }
        amount: { type: number }
        appointmentId: { type: string }
        clientName: { type: string }
        serviceName: { type: string }
        date: { type: string }
        dueAt: { type: string, format: date-time }
      required: [id, artistProfileId, artistName, amount, appointmentId, clientName, serviceName, date, dueAt]

    OwnerPayoutGroup:
      type: object
      properties:
        artistProfileId: { type: string }
        artistName: { type: string }
        totalAmount: { type: number }
        lineCount: { type: integer }
        bankVerificationStatus: { type: string, enum: [none, pending, verified, failed] }
        lines:
          type: array
          items: { $ref: "#/components/schemas/OwnerPayoutLine" }
      required: [artistProfileId, artistName, totalAmount, lineCount, lines, bankVerificationStatus]

    OwnerPayoutBatch:
      type: object
      properties:
        id: { type: string }
        artistProfileId: { type: string }
        totalAmount: { type: number }
        lineCount: { type: integer }
        reference: { type: string }
        paidBy: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, artistProfileId, totalAmount, lineCount, reference, paidBy, createdAt]

    MarkOwnerPayoutInput:
      type: object
      required: [reference, lineIds, expectedTotal]
      properties:
        reference: { type: string, minLength: 1 }
        lineIds:
          type: array
          minItems: 1
          items: { type: string }
        expectedTotal: { type: number }

    OwnerPaymentOverview:
      type: object
      properties:
        appointmentId: { type: string }
        clientName: { type: string }
        stylistName: { type: string }
        serviceName: { type: string }
        date: { type: string }
        payoutStatus: { type: string, enum: [held, released, disputed] }
        grossAmount: { type: number }
        platformFeeAmount: { type: number }
        artistPool: { type: number }
        isTeamBooking: { type: boolean }
        ledger:
          type: array
          items:
            type: object
            properties:
              appointmentId: { type: string }
              artistProfileId: { type: string }
              artistName: { type: string }
              sharePercent: { type: number }
              grossAmount: { type: number }
              platformFeeAmount: { type: number }
              netAmount: { type: number }
              status: { type: string, enum: [due, paid, reversed] }
              paidAt: { type: ["string", "null"], format: date-time }
            required: [appointmentId, artistProfileId, artistName, sharePercent, grossAmount, platformFeeAmount, netAmount, status, paidAt]
      required: [appointmentId, clientName, stylistName, serviceName, date, payoutStatus, grossAmount, platformFeeAmount, artistPool, isTeamBooking, ledger]

    OwnerRegistryEntry:
      type: object
      required: [userId, name, email, role, joinedAt]
      properties:
        userId:
          type: string
        name:
          type: string
        email:
          type: string
        phone:
          type: ["string", "null"]
        role:
          type: string
          enum: [client, stylist, brand]
        businessName:
          type: ["string", "null"]
        specialty:
          type: ["string", "null"]
        verificationStatus:
          type: ["string", "null"]
          enum: [none, pending, verified, null]
        joinedAt:
          type: string
          format: date-time

    OwnerArtistSummary:
      type: object
      required: [profileId, userId, name, specialty, location, rating, reviewCount, verified, verificationStatus, accountStatus, joinedAt, completedBookings, totalBookings, cancelledBookings, cancellationRate, totalEarnings, complaintCount, disputeCount]
      properties:
        profileId: { type: string }
        userId: { type: string }
        name: { type: string }
        specialty: { type: string }
        location: { type: string }
        rating: { type: number }
        reviewCount: { type: integer }
        verified: { type: boolean }
        verificationStatus: { type: string }
        accountStatus: { type: string, enum: [active, suspended] }
        joinedAt: { type: string, format: date-time }
        completedBookings: { type: integer }
        totalBookings: { type: integer }
        cancelledBookings: { type: integer }
        cancellationRate: { type: number }
        totalEarnings: { type: number }
        complaintCount: { type: integer }
        disputeCount: { type: integer }

    OwnerArtistNotSubmitted:
      type: object
      required: [profileId, name, joinedAt, outstanding]
      properties:
        profileId:
          type: string
        name:
          type: string
        joinedAt:
          type: string
          format: date-time
        outstanding:
          type: array
          items:
            type: string
            enum: [ID number, ID document, Bank details, Bio, Services, Portfolio]

    OwnerArtistAccountStatusInput:
      type: object
      required: [status, reason]
      properties:
        status: { type: string, enum: [active, suspended] }
        reason: { type: string, minLength: 1, maxLength: 500 }

    OwnerArtistAccountStatusResult:
      type: object
      required: [accountStatus, reason]
      additionalProperties: false
      properties:
        accountStatus: { type: string, enum: [active, suspended] }
        reason: { type: string, minLength: 1, maxLength: 500 }

    OwnerArtistManagement:
      allOf:
        - $ref: "#/components/schemas/OwnerArtistSummary"
        - type: object
          required: [bookings, payouts, payoutBatches, historyLimit, historyOffset, nextOffset, historyTruncated]
          properties:
            bookings:
              type: array
              items:
                type: object
                required: [id, clientName, serviceName, date, status, price, payoutStatus]
                properties:
                  id: { type: string }
                  clientName: { type: string }
                  serviceName: { type: string }
                  date: { type: string }
                  status: { type: string }
                  price: { type: number }
                  payoutStatus: { type: string }
            payouts:
              type: array
              items:
                type: object
                required: [id, appointmentId, amount, status, dueAt, paidAt]
                properties:
                  id: { type: string }
                  appointmentId: { type: string }
                  amount: { type: number }
                  status: { type: string }
                  dueAt: { type: string, format: date-time }
                  paidAt: { type: ["string", "null"], format: date-time }
            payoutBatches:
              type: array
              items:
                type: object
                required: [id, totalAmount, lineCount, reference, createdAt]
                properties:
                  id: { type: string }
                  totalAmount: { type: number }
                  lineCount: { type: integer }
                  reference: { type: string }
                  createdAt: { type: string, format: date-time }
            historyLimit: { type: integer, minimum: 1, maximum: 100 }
            historyOffset: { type: integer, minimum: 0 }
            nextOffset: { type: ["integer", "null"] }
            historyTruncated: { type: boolean }

    OwnerRegistryService:
      type: object
      required: [id, name, price, duration]
      properties:
        id:
          type: string
        name:
          type: string
        price:
          type: number
        duration:
          type: integer

    OwnerRegistryArtistProfile:
      type: object
      required: [profileId, specialty, area, location, verified, verificationStatus, services, portfolioItemCount, identityDocumentAvailable, bank]
      properties:
        profileId:
          type: string
        specialty:
          type: string
        area:
          type: string
        location:
          type: string
        verified:
          type: boolean
        verificationStatus:
          type: string
          enum: [none, pending, verified]
        services:
          type: array
          items:
            $ref: "#/components/schemas/OwnerRegistryService"
        portfolioItemCount:
          type: integer
        identityDocumentAvailable:
          type: boolean
        bank:
          anyOf:
            - $ref: "#/components/schemas/BankAccountSafe"
            - type: "null"

    OwnerRegistryProfile:
      type: object
      required: [userId, name, email, role, joinedAt, artist]
      properties:
        userId:
          type: string
        name:
          type: string
        email:
          type: string
        phone:
          type: ["string", "null"]
        role:
          type: string
          enum: [client, stylist, brand]
        businessName:
          type: ["string", "null"]
        joinedAt:
          type: string
          format: date-time
        artist:
          anyOf:
            - $ref: "#/components/schemas/OwnerRegistryArtistProfile"
            - type: "null"

    SignupInput:
      type: object
      required: [name, email, password, role, phone]
      properties:
        name:
          type: string
          minLength: 2
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        phone:
          type: string
          minLength: 7
          maxLength: 32
        role:
          type: string
          enum: [client, stylist, brand]
        businessName:
          type: ["string", "null"]

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthResult:
      type: object
      required: [user, token]
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string

    User:
      type: object
      required: [id, name, email, role, isOwner, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [client, stylist, brand]
        isOwner:
          type: boolean
          description: >
            True only for the account whose email matches the server-side
            OWNER_EMAIL secret. Computed server-side and never derived from
            the frontend — OWNER_EMAIL is never sent to the browser.
        businessName:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        createdAt:
          type: string

    StylistProfile:
      type: object
      required: [id, name, specialty, location, rating, reviewCount, verified, services, portfolio, availability]
      properties:
        id:
          type: string
        name:
          type: string
        specialty:
          type: string
        location:
          type: string
        area:
          type: string
        bio:
          type: ["string", "null"]
        rating:
          type: number
        reviewCount:
          type: integer
        verified:
          type: boolean
        services:
          type: array
          items:
            $ref: "#/components/schemas/Service"
        portfolio:
          type: array
          items:
            $ref: "#/components/schemas/PortfolioItem"
        availability:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string
        instagram:
          type: ["string", "null"]
        website:
          type: ["string", "null"]
        accentColor:
          type: ["string", "null"]
        houseCalls:
          type: boolean
        reputationScore:
          type: ["number", "null"]
          description: Overall reputation score 0-100 computed from bookings, cancellations, repeat clients and reviews

    MyStylistProfile:
      allOf:
        - $ref: "#/components/schemas/StylistProfile"
        - type: object
          required: [userId, verificationStatus, phone, reputationBreakdown, profileReadiness]
          properties:
            userId:
              type: string
            verificationStatus:
              type: string
              enum: [none, pending, verified]
            phone:
              type: ["string", "null"]
            reputationBreakdown:
              type: ["object", "null"]
              properties:
                score:
                  type: number
                cancellationRate:
                  type: number
                repeatClientRate:
                  type: number
                completedBookings:
                  type: integer
                totalBookings:
                  type: integer
            profileReadiness:
              $ref: "#/components/schemas/ProfileReadiness"

    StylistProfileUpdate:
      type: object
      properties:
        bio:
          type: string
        location:
          type: string
        area:
          type: string
        specialty:
          type: string
        instagram:
          type: string
        website:
          type: string
        availability:
